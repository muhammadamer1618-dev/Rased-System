<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>راصد - تحليل نتائج الاختبار</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>

*{box-sizing:border-box}

:root{
  --navy:#073b68;
  --navy2:#0d558c;
  --blue:#2585d8;
  --green:#35b765;
  --yellow:#ffd44d;
  --red:#ef3f4a;
  --gray:#d9dee3;
  --border:#ccd5de;
  --text:#14283c;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f3f6f9;
  color:var(--text);
}

/* =====================================================
   HEADER
===================================================== */

.header{
  background:linear-gradient(135deg,#06365f,#0a558b);
  color:#fff;
  text-align:center;
  padding:15px;
  position:relative;
  box-shadow:0 3px 12px rgba(0,0,0,.16);
}

.logo{
  width:68px;
  height:68px;
  object-fit:contain;
  background:#fff;
  border-radius:50%;
  padding:4px;
}

.header h1{
  margin:4px 0 2px;
  font-size:24px;
}

.header p{
  margin:0;
  color:#f0c739;
  font-weight:bold;
}

.header-actions{
  position:absolute;
  left:18px;
  top:22px;
  display:flex;
  gap:8px;
}

button{
  font-family:Tahoma,Arial,sans-serif;
  border:0;
  border-radius:7px;
  padding:10px 14px;
  font-weight:bold;
  cursor:pointer;
}

.back-btn{
  background:#fff;
  color:#183b5a;
}

.print-btn{
  background:#d6a821;
  color:#fff;
}

/* =====================================================
   GENERAL
===================================================== */

.container{
  width:min(1200px,96%);
  margin:18px auto 35px;
}

.card{
  background:#fff;
  border:1px solid #dce3e9;
  border-radius:10px;
  box-shadow:0 2px 12px rgba(0,0,0,.055);
  margin-bottom:13px;
  overflow:hidden;
}

.card-title{
  padding:11px 15px;
  border-bottom:1px solid #e2e7eb;
  color:#0b4776;
  font-size:15px;
  font-weight:bold;
}

.card-body{
  padding:14px;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#7b8997;
}

/* =====================================================
   FILTERS
===================================================== */

.mode-note{
  background:#e8f3ff;
  border:1px solid #c3dcf4;
  color:#174f7c;
  border-radius:7px;
  padding:9px 11px;
  font-size:11px;
  margin-bottom:11px;
}

.filters{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.field label{
  display:block;
  text-align:center;
  font-size:11px;
  font-weight:bold;
  margin-bottom:5px;
}

select,
input{
  width:100%;
  height:41px;
  border:1px solid #bec9d3;
  border-radius:6px;
  background:#fff;
  color:#111;
  padding:6px 10px;
  font-family:Tahoma,Arial,sans-serif;
  direction:rtl;
  text-align:right;
}

.selected-info{
  margin-top:10px;
  padding:8px;
  text-align:center;
  border-radius:6px;
  background:#f6f8fa;
  border:1px solid #dce2e7;
  font-size:11px;
  font-weight:bold;
}

/* =====================================================
   LEVEL SETTINGS
===================================================== */

.settings{
  display:grid;
  grid-template-columns:repeat(3,1fr) auto;
  gap:8px;
  align-items:end;
}

.setting label{
  display:block;
  font-size:10px;
  font-weight:bold;
  margin-bottom:4px;
}

.setting input{
  height:36px;
  text-align:center;
}

.analyze-btn{
  height:36px;
  background:#6f42c1;
  color:#fff;
}

/* =====================================================
   PRINT HEADER
===================================================== */

.report-header{
  background:#fff;
  text-align:center;
  padding:8px 12px 6px;
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:9px;
}

.report-logo{
  width:62px;
  height:62px;
  object-fit:contain;
}

.report-header h2{
  margin:1px 0;
  font-size:21px;
  color:#073b68;
}

.report-header h3{
  margin:2px 0 8px;
  font-size:15px;
}

.meta{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border:1px solid #aeb9c3;
  border-left:0;
}

.meta-item{
  border-left:1px solid #aeb9c3;
}

.meta-title{
  background:#edf1f4;
  font-weight:bold;
  padding:5px;
  font-size:10px;
}

.meta-value{
  padding:6px 4px;
  font-size:11px;
  font-weight:bold;
}

/* =====================================================
   KPI - COMPACT
===================================================== */

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:5px;
  margin-bottom:9px;
}

.kpi{
  min-height:60px;
  background:#fff;
  border:1px solid #cfd7de;
  border-radius:6px;
  text-align:center;
  padding:6px 3px;
}

.kpi-label{
  font-size:9px;
  font-weight:bold;
  min-height:20px;
}

.kpi-value{
  font-size:19px;
  line-height:22px;
  font-weight:bold;
  color:#073b68;
}

.kpi.green .kpi-value{color:#198754}
.kpi.red .kpi-value{color:#e0333e}
.kpi.gold .kpi-value{color:#b88700}
.kpi.purple .kpi-value{color:#6f42c1}

/* =====================================================
   LEVEL STRIP
===================================================== */

.level-section{
  border:1px solid #ccd5dc;
  border-radius:7px;
  background:#fff;
  padding:8px;
  margin-bottom:9px;
}

.small-heading{
  text-align:center;
  font-size:12px;
  font-weight:bold;
  margin-bottom:7px;
}

.level-strip{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  overflow:hidden;
  border-radius:5px;
  border:1px solid #d2d7dc;
}

.level-segment{
  text-align:center;
  padding:7px 3px 5px;
  font-weight:bold;
}

.level-segment .count{
  font-size:18px;
  display:block;
}

.level-segment .percent{
  font-size:9px;
  display:block;
  margin-top:2px;
}

.level-high{
  background:#40ba67;
  color:white;
}

.level-medium{
  background:#3488d8;
  color:white;
}

.level-care{
  background:#ffd44d;
  color:#222;
}

.level-case{
  background:#ef404a;
  color:white;
}

.level-labels{
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.level-label{
  text-align:center;
  padding-top:4px;
  font-size:9px;
  line-height:1.45;
}

.level-label strong{
  display:block;
  font-size:10px;
}

/* =====================================================
   CHART
===================================================== */

.chart-box{
  background:#fff;
  border:1px solid #ccd5dc;
  border-radius:7px;
  padding:8px 12px 7px;
  margin-bottom:9px;
}

.chart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:4px;
}

.chart-title{
  font-size:12px;
  font-weight:bold;
  color:#073b68;
}

.chart-caption{
  font-size:9px;
}

.chart-area{
  height:190px;
  display:flex;
  direction:ltr;
  position:relative;
}

.y-axis{
  width:31px;
  height:160px;
  margin-top:2px;
  border-right:1px solid #8c98a3;
  position:relative;
}

.y-label{
  position:absolute;
  right:5px;
  transform:translateY(50%);
  font-size:8px;
  color:#475569;
}

.plot{
  flex:1;
  height:160px;
  margin-top:2px;
  border-bottom:1px solid #8c98a3;
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-around;
  padding:0 4%;
  background:
    repeating-linear-gradient(
      to top,
      transparent 0,
      transparent 31px,
      #edf0f2 31px,
      #edf0f2 32px
    );
}

.bar-group{
  width:18%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  position:relative;
}

.bar-value{
  font-size:11px;
  font-weight:bold;
  margin-bottom:3px;
  direction:rtl;
}

.bar{
  width:58%;
  min-height:2px;
  border-radius:3px 3px 0 0;
}

.bar.green{background:#35b765}
.bar.blue{background:#3488d8}
.bar.yellow{background:#ffd44d}
.bar.red{background:#ef404a}

.bar-name{
  position:absolute;
  top:165px;
  width:130%;
  text-align:center;
  font-size:9px;
  font-weight:bold;
  direction:rtl;
}

/* =====================================================
   TABLE
===================================================== */

.details-box{
  background:#fff;
  border:1px solid #ccd5dc;
  border-radius:7px;
  overflow:hidden;
}

.details-title{
  padding:7px;
  font-size:12px;
  font-weight:bold;
  text-align:center;
  color:#073b68;
  border-bottom:1px solid #ccd5dc;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:720px;
}

th{
  background:#e8edf1;
  color:#152a3e;
  font-size:10px;
}

th,td{
  padding:6px 5px;
  border-left:1px solid #cbd3da;
  border-bottom:1px solid #cbd3da;
  text-align:center;
}

td{
  font-size:10px;
}

td.student-name{
  text-align:right;
  font-weight:bold;
}

/* whole row classification */

.row-high td{
  background:#c9f0cd;
}

.row-medium td{
  background:#d5eaff;
}

.row-care td{
  background:#fff0a9;
}

.row-case td{
  background:#ffc8cb;
}

.row-absent td,
.row-unrecorded td{
  background:#e3e6e8;
  color:#3d4852;
}

.percent-high{
  font-weight:bold;
  color:#0d6c32;
}

.percent-medium{
  font-weight:bold;
  color:#125da3;
}

.percent-care{
  font-weight:bold;
  color:#7c6000;
}

.percent-case{
  font-weight:bold;
  color:#b51f28;
}

/* =====================================================
   LEGEND
===================================================== */

.legend{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:17px;
  padding:7px;
  margin-top:7px;
  border:1px solid #e0e4e7;
  border-radius:6px;
  background:#f8f9fa;
  font-size:9px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
}

.dot{
  width:11px;
  height:11px;
  border-radius:50%;
}

.dot.green{background:#35b765}
.dot.blue{background:#3488d8}
.dot.yellow{background:#ffd44d}
.dot.red{background:#ef404a}
.dot.gray{background:#9da5ac}

/* =====================================================
   FOOTER
===================================================== */

.report-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:2px solid #173d61;
  margin-top:8px;
  padding:6px 3px 0;
  font-size:9px;
  font-weight:bold;
}

.screen-footer{
  text-align:center;
  color:#71808e;
  padding:14px;
  font-size:10px;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:850px){

  .header-actions{
    position:static;
    justify-content:center;
    margin-top:10px;
  }

  .filters{
    grid-template-columns:repeat(2,1fr);
  }

  .kpi-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .settings{
    grid-template-columns:repeat(2,1fr);
  }

}

/* =====================================================
   PRINT - A4 PORTRAIT
===================================================== */

@media print{

  @page{
    size:A4 portrait;
    margin:5mm;
  }

  html,
  body{
    width:100%;
    margin:0;
    padding:0;
    background:white;
  }

  .header,
  .selection-card,
  .settings-card,
  .screen-footer{
    display:none !important;
  }

  .container{
    width:100%;
    margin:0;
    padding:0;
  }

  #analysisArea{
    width:100%;
  }

  .report-header{
    padding:2px 4px 3px;
    margin:0 0 3px;
    border-radius:0;
  }

  .report-logo{
    width:40px;
    height:40px;
  }

  .report-header h2{
    font-size:14px;
    margin:0;
  }

  .report-header h3{
    font-size:10px;
    margin:0 0 3px;
  }

  .meta{
    margin-top:2px;
  }

  .meta-title{
    padding:2px;
    font-size:6.8px;
  }

  .meta-value{
    padding:2px;
    font-size:7px;
  }

  .kpi-grid{
    grid-template-columns:repeat(8,1fr);
    gap:2px;
    margin-bottom:3px;
  }

  .kpi{
    min-height:36px;
    padding:2px 1px;
    border-radius:2px;
  }

  .kpi-label{
    font-size:5.8px;
    min-height:13px;
  }

  .kpi-value{
    font-size:11px;
    line-height:12px;
  }

  .level-section{
    padding:3px;
    margin-bottom:3px;
    border-radius:0;
  }

  .small-heading{
    font-size:7px;
    margin-bottom:2px;
  }

  .level-segment{
    padding:2px;
  }

  .level-segment .count{
    font-size:10px;
  }

  .level-segment .percent{
    font-size:5.5px;
  }

  .level-label{
    padding-top:1px;
    font-size:5.5px;
    line-height:1.2;
  }

  .level-label strong{
    font-size:6px;
  }

  .chart-box{
    padding:3px 5px 2px;
    margin-bottom:3px;
    border-radius:0;
  }

  .chart-header{
    margin-bottom:1px;
  }

  .chart-title{
    font-size:7px;
  }

  .chart-caption{
    font-size:5.5px;
  }

  .chart-area{
    height:108px;
  }

  .y-axis{
    width:21px;
    height:87px;
  }

  .y-label{
    font-size:5px;
  }

  .plot{
    height:87px;
    background:
      repeating-linear-gradient(
        to top,
        transparent 0,
        transparent 16px,
        #e7eaed 16px,
        #e7eaed 17px
      );
  }

  .bar-value{
    font-size:6px;
    margin-bottom:1px;
  }

  .bar{
    width:48%;
  }

  .bar-name{
    top:90px;
    font-size:5.5px;
  }

  .details-box{
    border-radius:0;
  }

  .details-title{
    padding:3px;
    font-size:7px;
  }

  .table-wrap{
    overflow:visible;
  }

  table{
    min-width:0;
    table-layout:fixed;
  }

  th,td{
    padding:2px 2px;
    font-size:5.8px;
    border:1px solid #888;
    line-height:1.15;
  }

  th{
    font-size:5.8px;
  }

  th:nth-child(1),
  td:nth-child(1){
    width:5%;
  }

  th:nth-child(2),
  td:nth-child(2){
    width:16%;
  }

  th:nth-child(3),
  td:nth-child(3){
    width:38%;
  }

  th:nth-child(4),
  td:nth-child(4){
    width:13%;
  }

  th:nth-child(5),
  td:nth-child(5){
    width:15%;
  }

  th:nth-child(6),
  td:nth-child(6){
    width:13%;
  }

  tr{
    break-inside:avoid;
    page-break-inside:avoid;
  }

  .legend{
    gap:8px;
    padding:2px;
    margin-top:2px;
    font-size:5.5px;
    border-radius:0;
  }

  .dot{
    width:6px;
    height:6px;
  }

  .report-footer{
    margin-top:3px;
    padding-top:2px;
    font-size:5.8px;
    border-top:1px solid #173d61;
  }

}

</style>
</head>

     HEADER

</div>

</div>

<div

</div>

min="0"
max="100">

</div>

<label>أولى بالرعاية تبدأ من %</label>

<input
id="careMin"
type="number"
value="50"
min="0"
max="100">

</div>


<button
class="analyze-btn"

</button>

</div>

</div>

</div>

<div id="analysisArea">

</div>

</div>

</div>

/* =====================================================

function el(id){
return document.getElementById(id);
}


function escapeHtml(value){

return String(value??"")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function unique(values){
return [...new Set(values)];
}


function clearSelect(
select,
text
){

select.innerHTML="";

const option=
document.createElement("option");

option.value="";
option.textContent=text;

select.appendChild(option);

}


function formatNumber(value){

if(
value===null ||
value===undefined ||
Number.isNaN(Number(value))
){

return "-";

}

const n=Number(value);

return Number.isInteger(n)
?
String(n)
:
n.toFixed(2);

}


function sortGrades(list){

return list.sort(
(a,b)=>
gradeOrder.indexOf(a)-
gradeOrder.indexOf(b)
);

}


function sortSections(list){

return list.sort(
(a,b)=>
sectionOrder.indexOf(a)-
sectionOrder.indexOf(b)
);

}

/* =====================================================
   LEVELS
===================================================== */

function getLevelSettings(){

let high=
Number(
el("highMin").value
);


let medium=
Number(
el("mediumMin").value
);


let care=
Number(
el("careMin").value
);


if(Number.isNaN(high)) high=85;
if(Number.isNaN(medium)) medium=70;
if(Number.isNaN(care)) care=50;


high=
Math.max(
0,
Math.min(100,high)
);


medium=
Math.max(
0,
Math.min(100,medium)
);


care=
Math.max(
0,
Math.min(100,care)
);


if(medium>=high){

medium=
Math.max(
0,
high-1
);

el("mediumMin").value=
medium;

}


if(care>=medium){

care=
Math.max(
0,
medium-1
);

el("careMin").value=
care;

}


el("highMin").value=
high;


return{
high,
medium,
care
};

}


/* =====================================================
   ANALYZE
===================================================== */

function reanalyze(){

if(!selectedTest){
return;
}


const limits=
getLevelSettings();


analyzedStudents=
students.map(student=>{

const record=
gradeRecords.find(
r=>
String(r.studentCode)===
String(student.code)
);


if(!record){

return{

student,
attendance:"unrecorded",
mark:null,
percentage:null,
level:"unrecorded"

};

}


if(
record.attendance===
"absent"
){

return{

student,
record,
attendance:"absent",
mark:null,
percentage:null,
level:"absent"

};

}


const mark=
Number(record.mark);


const fullMark=
Number(
record.fullMark ||
selectedTest.fullMark
);


const percentage=

fullMark>0
?
(mark/fullMark)*100
:
0;


let level="case";


if(
percentage>=limits.high
){

level="high";

}

else if(
percentage>=limits.medium
){

level="medium";

}

else if(
percentage>=limits.care
){

level="care";

}


return{

student,
record,
attendance:"present",
mark,
fullMark,
percentage,
level

};

});


renderAnalysis();

}

/* =====================================================
   CHART
===================================================== */

function buildChart(
high,
medium,
care,
cases,
totalPresent
){

const values=[
high,
medium,
care,
cases
];


const maxValue=
Math.max(
...values,
1
);


/*
نجعل أعلى قيمة في الرسم تصل تقريبًا إلى
85% من مساحة الرسم.
*/

function height(value){

if(value===0){
return 2;
}

return Math.max(
4,
(value/maxValue)*82
);

}


const axisMax=
Math.max(
maxValue,
4
);


const axisValues=[
axisMax,
Math.round(axisMax*.75),
Math.round(axisMax*.5),
Math.round(axisMax*.25),
0
];


return`

<div class="chart-box">

<div class="chart-header">

<div class="chart-title">
الرسم البياني لتوزيع المستويات
</div>

<div class="chart-caption">
عدد الطلاب
</div>

</div>


<div class="chart-area">

<div class="y-axis">

${axisValues.map(
(value,index)=>{

const bottom=
(index/(axisValues.length-1))*100;


return`

<span
class="y-label"
style="bottom:${bottom}%"
>
${value}
</span>

`;

}
).join("")}

</div>


<div class="plot">

${chartBar(
high,
totalPresent,
height(high),
"green",
"مرتفع"
)}

${chartBar(
medium,
totalPresent,
height(medium),
"blue",
"متوسط"
)}

${chartBar(
care,
totalPresent,
height(care),
"yellow",
"أولى بالرعاية"
)}

${chartBar(
cases,
totalPresent,
height(cases),
"red",
"دراسة حالة"
)}

</div>

</div>

</div>

`;

}


function chartBar(
value,
total,
heightPercent,
color,
name

const percent=
total
?
(value/total)*100
:
0;


return`

class="bar ${color}"
style="height:${heightPercent}%">
</div>

<div class="bar-name">
${name}
</div>

</div>

`;

}

*/

if(isTeacher){

const allowed=
assignments.some(a=>

a.subjectId===
incoming.subjectId &&

a.grade===
incoming.grade &&

a.section===
incoming.section

);


if(!allowed){
return;
}

}


const subjectSelect=
el("subjectSelect");


const subjectExists=
[...subjectSelect.options]
.some(
o=>
o.value===
incoming.subjectId
);


if(!subjectExists){
return;
}


subjectSelect.value=
incoming.subjectId;


selectedSubjectId=
incoming.subjectId;


const subject=
subjects.find(
s=>s.id===selectedSubjectId
);


selectedSubjectName=
subject?.name||"";


await fillGrades();


if(incoming.grade){

const gradeSelect=
el("gradeSelect");


const exists=
[...gradeSelect.options]
.some(
o=>
o.value===incoming.grade
);


if(exists){

gradeSelect.value=
incoming.grade;

selectedGrade=
incoming.grade;

await fillSections();

}

}


if(
incoming.section &&
selectedGrade
){

const sectionSelect=
el("sectionSelect");


const exists=
[...sectionSelect.options]
.some(
o=>
o.value===
incoming.section
);


if(exists){

sectionSelect.value=
incoming.section;

selectedSection=
incoming.section;

await loadTests();

}

}


if(
incoming.testId &&
selectedSection
){

const exists=
tests.some(
t=>
t.id===incoming.testId
);


if(exists){

el("testSelect").value=
incoming.testId;


selectedTest=
tests.find(
t=>t.id===incoming.testId
);


showSelectedInfo();

await loadResults();

}

}

}


/* =====================================================
   MODE
===================================================== */

function renderMode(){

if(isAdmin){

el("modeNote").innerHTML=

"👑 <strong>الإدارة:</strong> يمكنك تحليل أي مادة وأي فصل وأي اختبار في المدرسة.";

}

else{

el("modeNote").innerHTML=

"👨‍🏫 <strong>المعلم:</strong> يمكنك تحليل المواد والفصول المسندة إليك فقط.";

}

}


/* =====================================================
   START
===================================================== */

async function start(){

if(!protectPage()){
return;
}


try{

await loadTeacher();

await loadSubjects();

renderMode();

await applyIncoming();

}

catch(error){

console.error(error);


alert(

"حدث خطأ أثناء تحميل التحليل:\n"+
error.message

);

}

}


start();

</script>
