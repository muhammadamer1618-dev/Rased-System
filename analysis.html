<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>راصد - تحليل نتائج الاختبار</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>

*{
    box-sizing:border-box;
}

:root{
    --navy:#073b68;
    --navy2:#0d558c;

    --green:#35b765;
    --greenLight:#d8f3df;
    --greenDark:#126b34;

    --blue:#3488d8;
    --blueLight:#dceeff;
    --blueDark:#125c9d;

    --yellow:#ffd44d;
    --yellowLight:#fff1aa;
    --yellowDark:#795d00;

    --red:#ef404a;
    --redLight:#ffd1d4;
    --redDark:#aa1f28;

    --purple:#7654c4;
    --purpleLight:#eee7ff;

    --gray:#9da5ac;
    --grayLight:#e7eaed;

    --border:#ccd5de;
    --text:#14283c;
}

html,
body{
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f3f6f9;
    color:var(--text);
}

/* =====================================================
   HEADER
===================================================== */

.header{
    background:linear-gradient(135deg,#06365f,#0a558b);
    color:#fff;
    text-align:center;
    padding:14px;
    position:relative;
    box-shadow:0 3px 12px rgba(0,0,0,.16);
}

.logo{
    width:68px;
    height:68px;
    object-fit:contain;
    background:#fff;
    border-radius:50%;
    padding:4px;
}

.header h1{
    margin:3px 0 2px;
    font-size:24px;
}

.header p{
    margin:0;
    color:#f0c739;
    font-weight:bold;
}

.header-actions{
    position:absolute;
    left:18px;
    top:22px;
    display:flex;
    gap:8px;
}

button{
    font-family:Tahoma,Arial,sans-serif;
    border:0;
    border-radius:7px;
    padding:10px 14px;
    font-weight:bold;
    cursor:pointer;
}

.back-btn{
    background:#fff;
    color:#183b5a;
}

.print-btn{
    background:#d6a821;
    color:#fff;
}

/* =====================================================
   GENERAL
===================================================== */

.container{
    width:min(1200px,96%);
    margin:16px auto 35px;
}

.card{
    background:#fff;
    border:1px solid #dce3e9;
    border-radius:10px;
    box-shadow:0 2px 12px rgba(0,0,0,.055);
    margin-bottom:12px;
    overflow:hidden;
}

.card-title{
    padding:10px 15px;
    border-bottom:1px solid #e2e7eb;
    color:#0b4776;
    font-size:15px;
    font-weight:bold;
}

.card-body{
    padding:13px;
}

.empty{
    text-align:center;
    padding:35px 15px;
    color:#7b8997;
}

/* =====================================================
   FILTERS
===================================================== */

.mode-note{
    background:#e8f3ff;
    border:1px solid #c3dcf4;
    color:#174f7c;
    border-radius:7px;
    padding:8px 11px;
    font-size:11px;
    margin-bottom:10px;
}

.filters{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.field label{
    display:block;
    text-align:center;
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
}

select,
input{
    width:100%;
    height:41px;
    border:1px solid #bec9d3;
    border-radius:6px;
    background:#fff;
    color:#111;
    padding:6px 10px;
    font-family:Tahoma,Arial,sans-serif;
    direction:rtl;
    text-align:right;
}

.selected-info{
    margin-top:9px;
    padding:7px;
    text-align:center;
    border-radius:6px;
    background:#f6f8fa;
    border:1px solid #dce2e7;
    font-size:11px;
    font-weight:bold;
}

/* =====================================================
   SETTINGS
===================================================== */

.settings{
    display:grid;
    grid-template-columns:repeat(3,1fr) auto;
    gap:8px;
    align-items:end;
}

.setting label{
    display:block;
    font-size:10px;
    font-weight:bold;
    margin-bottom:4px;
}

.setting input{
    height:36px;
    text-align:center;
}

.analyze-btn{
    height:36px;
    background:#6f42c1;
    color:#fff;
}

/* =====================================================
   REPORT HEADER
===================================================== */

.report-header{
    background:#fff;
    text-align:center;
    padding:7px 10px 6px;
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:7px;
}

.report-logo{
    width:56px;
    height:56px;
    object-fit:contain;
}

.report-header h2{
    margin:0;
    font-size:19px;
    color:#073b68;
}

.report-header h3{
    margin:2px 0 6px;
    font-size:14px;
}

.meta{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border:1px solid #aeb9c3;
    border-left:0;
}

.meta-item{
    border-left:1px solid #aeb9c3;
}

.meta-title{
    background:#dceaf5;
    color:#073b68;
    font-weight:bold;
    padding:4px;
    font-size:9px;
}

.meta-value{
    padding:5px 3px;
    font-size:10px;
    font-weight:bold;
}

/* =====================================================
   KPI
===================================================== */

.kpi-grid{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:4px;
    margin-bottom:7px;
}

.kpi{
    min-height:54px;
    border:1px solid #cfd7de;
    border-radius:6px;
    text-align:center;
    padding:5px 2px;
    background:#f8fbfd;
}

.kpi-label{
    font-size:8.5px;
    font-weight:bold;
    min-height:18px;
}

.kpi-value{
    font-size:18px;
    line-height:21px;
    font-weight:bold;
    color:#073b68;
}

.kpi.total{
    background:#e6f1f9;
    border-color:#aacbe3;
}

.kpi.green{
    background:var(--greenLight);
    border-color:#8bd29f;
}

.kpi.green .kpi-value{
    color:var(--greenDark);
}

.kpi.red{
    background:var(--redLight);
    border-color:#ee9da3;
}

.kpi.red .kpi-value{
    color:var(--redDark);
}

.kpi.gold{
    background:#fff3c4;
    border-color:#e7cd68;
}

.kpi.gold .kpi-value{
    color:#806200;
}

.kpi.purple{
    background:var(--purpleLight);
    border-color:#c5b5ed;
}

.kpi.purple .kpi-value{
    color:#6042aa;
}

.kpi.blue{
    background:var(--blueLight);
    border-color:#a4cce9;
}

.kpi.blue .kpi-value{
    color:var(--blueDark);
}

/* =====================================================
   LEVELS
===================================================== */

.level-section{
    border:1px solid #ccd5dc;
    border-radius:7px;
    background:#fff;
    padding:6px;
    margin-bottom:7px;
}

.small-heading{
    text-align:center;
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
    color:#073b68;
}

.level-strip{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    overflow:hidden;
    border-radius:5px;
    border:1px solid #c7ced4;
}

.level-segment{
    text-align:center;
    padding:5px 3px;
    font-weight:bold;
}

.level-segment .count{
    font-size:17px;
    display:block;
}

.level-segment .percent{
    font-size:8px;
    display:block;
}

.level-high{
    background:#35b765 !important;
    color:#fff !important;
}

.level-medium{
    background:#3488d8 !important;
    color:#fff !important;
}

.level-care{
    background:#ffd44d !important;
    color:#322800 !important;
}

.level-case{
    background:#ef404a !important;
    color:#fff !important;
}

.level-labels{
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.level-label{
    text-align:center;
    padding-top:3px;
    font-size:8px;
    line-height:1.35;
}

.level-label strong{
    display:block;
    font-size:9px;
}

/* =====================================================
   CHART
===================================================== */

.chart-box{
    background:#fff;
    border:1px solid #ccd5dc;
    border-radius:7px;
    padding:6px 10px 5px;
    margin-bottom:7px;
}

.chart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:3px;
}

.chart-title{
    font-size:11px;
    font-weight:bold;
    color:#073b68;
}

.chart-caption{
    font-size:8px;
    color:#667788;
}

.chart-area{
    height:165px;
    display:flex;
    direction:ltr;
    position:relative;
}

.y-axis{
    width:30px;
    height:137px;
    margin-top:2px;
    border-right:1px solid #7e8993;
    position:relative;
}

.y-label{
    position:absolute;
    right:5px;
    transform:translateY(50%);
    font-size:7px;
    color:#475569;
}

.plot{
    flex:1;
    height:137px;
    margin-top:2px;
    border-bottom:1px solid #7e8993;
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:space-around;
    padding:0 5%;
    background:
        repeating-linear-gradient(
            to top,
            transparent 0,
            transparent 26px,
            #e8ecef 26px,
            #e8ecef 27px
        );
}

.bar-group{
    width:19%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;
    position:relative;
}

.bar-value{
    font-size:10px;
    font-weight:bold;
    margin-bottom:2px;
    direction:rtl;
    color:#162b3e;
}

.bar{
    width:58%;
    min-height:3px;
    border-radius:5px 5px 0 0;
}

.bar.green{
    background:#35b765 !important;
    background-color:#35b765 !important;
    border:1px solid #278d4b;
}

.bar.blue{
    background:#3488d8 !important;
    background-color:#3488d8 !important;
    border:1px solid #2469a9;
}

.bar.yellow{
    background:#ffd44d !important;
    background-color:#ffd44d !important;
    border:1px solid #d5a900;
}

.bar.red{
    background:#ef404a !important;
    background-color:#ef404a !important;
    border:1px solid #c52d36;
}

.bar-name{
    position:absolute;
    top:141px;
    width:150%;
    text-align:center;
    font-size:8px;
    font-weight:bold;
    direction:rtl;
}

/* =====================================================
   DETAILS
===================================================== */

.details-box{
    background:#fff;
    border:1px solid #bfcbd4;
    border-radius:7px;
    overflow:hidden;
}

.details-title{
    padding:6px;
    font-size:11px;
    font-weight:bold;
    text-align:center;
    color:#fff;
    background:#073b68;
}

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th{
    background:#dbe8f2;
    color:#073b68;
    font-size:9px;
    font-weight:bold;
}

th,
td{
    padding:5px 4px;
    border-left:1px solid #bfc7ce;
    border-bottom:1px solid #bfc7ce;
    text-align:center;
}

td{
    font-size:9px;
}

td.student-name{
    text-align:right;
    font-weight:bold;
}

/* =====================================================
   STUDENT COLORS
===================================================== */

.row-high td{
    background:#d8f3df !important;
}

.row-high .student-name{
    color:#126b34 !important;
    font-weight:900;
}

.row-medium td{
    background:#dceeff !important;
}

.row-medium .student-name{
    color:#125c9d !important;
    font-weight:900;
}

.row-care td{
    background:#fff1aa !important;
}

.row-care .student-name{
    color:#735800 !important;
    font-weight:900;
}

.row-case td{
    background:#ffd1d4 !important;
}

.row-case .student-name{
    color:#aa1f28 !important;
    font-weight:900;
}

.row-absent td,
.row-unrecorded td{
    background:#e7eaed !important;
    color:#4c5660;
}

.row-absent .student-name,
.row-unrecorded .student-name{
    color:#4c5660 !important;
    font-weight:900;
}

.percent-high{
    color:#126b34;
    font-weight:bold;
}

.percent-medium{
    color:#125c9d;
    font-weight:bold;
}

.percent-care{
    color:#735800;
    font-weight:bold;
}

.percent-case{
    color:#aa1f28;
    font-weight:bold;
}

/* =====================================================
   LEGEND
===================================================== */

.legend{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    padding:5px;
    margin-top:5px;
    border:1px solid #d5dde3;
    border-radius:5px;
    background:#f8fafb;
    font-size:8px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:4px;
    font-weight:bold;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
}

.dot.green{background:#35b765 !important}
.dot.blue{background:#3488d8 !important}
.dot.yellow{background:#ffd44d !important}
.dot.red{background:#ef404a !important}
.dot.gray{background:#9da5ac !important}

/* =====================================================
   FOOTER
===================================================== */

.report-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:2px solid #173d61;
    margin-top:6px;
    padding:5px 3px 0;
    font-size:8px;
    font-weight:bold;
}

.screen-footer{
    text-align:center;
    color:#71808e;
    padding:12px;
    font-size:10px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:850px){

    .header-actions{
        position:static;
        justify-content:center;
        margin-top:10px;
    }

    .filters{
        grid-template-columns:repeat(2,1fr);
    }

    .settings{
        grid-template-columns:repeat(2,1fr);
    }

    .kpi-grid{
        grid-template-columns:repeat(4,1fr);
    }
}

/* =====================================================
   PRINT
===================================================== */

@media print{

    @page{
        size:A4 portrait;
        margin:4.5mm;
    }

    /*
       الحفاظ على جميع الألوان في الطباعة
    */

    *,
    *::before,
    *::after{
        -webkit-print-color-adjust:exact !important;
        print-color-adjust:exact !important;
        color-adjust:exact !important;
    }

    html,
    body{
        width:100%;
        margin:0 !important;
        padding:0 !important;
        background:#fff !important;
    }

    .header,
    .selection-card,
    .settings-card,
    .screen-footer{
        display:none !important;
    }

    .container{
        width:100%;
        margin:0 !important;
        padding:0 !important;
    }

    #analysisArea{
        width:100%;
        margin:0;
        padding:0;
    }

    /* HEADER */

    .report-header{
        padding:1px 3px 2px;
        margin:0 0 2px;
        border-radius:0;
    }

    .report-logo{
        width:36px;
        height:36px;
    }

    .report-header h2{
        font-size:12px;
        margin:0;
    }

    .report-header h3{
        font-size:8px;
        margin:0 0 2px;
    }

    .meta{
        margin-top:1px;
    }

    .meta-title{
        padding:1.5px;
        font-size:5.8px;
        background:#dceaf5 !important;
        color:#073b68 !important;
    }

    .meta-value{
        padding:2px;
        font-size:6px;
    }

    /* KPI */

    .kpi-grid{
        grid-template-columns:repeat(8,1fr);
        gap:1.5px;
        margin-bottom:2px;
    }

    .kpi{
        min-height:31px;
        padding:1.5px 1px;
        border-radius:2px;
    }

    .kpi-label{
        font-size:5px;
        min-height:11px;
    }

    .kpi-value{
        font-size:9px;
        line-height:10px;
    }

    .kpi.total{
        background:#e6f1f9 !important;
    }

    .kpi.green{
        background:#d8f3df !important;
    }

    .kpi.red{
        background:#ffd1d4 !important;
    }

    .kpi.gold{
        background:#fff3c4 !important;
    }

    .kpi.purple{
        background:#eee7ff !important;
    }

    .kpi.blue{
        background:#dceeff !important;
    }

    /* LEVELS */

    .level-section{
        padding:2px;
        margin-bottom:2px;
        border-radius:0;
    }

    .small-heading{
        font-size:5.8px;
        margin-bottom:1px;
    }

    .level-segment{
        padding:1.5px;
    }

    .level-segment .count{
        font-size:8px;
    }

    .level-segment .percent{
        font-size:4.5px;
    }

    .level-high{
        background:#35b765 !important;
        color:#fff !important;
    }

    .level-medium{
        background:#3488d8 !important;
        color:#fff !important;
    }

    .level-care{
        background:#ffd44d !important;
        color:#322800 !important;
    }

    .level-case{
        background:#ef404a !important;
        color:#fff !important;
    }

    .level-label{
        padding-top:1px;
        font-size:4.5px;
        line-height:1.1;
    }

    .level-label strong{
        font-size:5px;
    }

    /* CHART */

    .chart-box{
        padding:2px 4px 1px;
        margin-bottom:2px;
        border-radius:0;
    }

    .chart-header{
        margin-bottom:0;
    }

    .chart-title{
        font-size:5.8px;
    }

    .chart-caption{
        font-size:4.5px;
    }

    .chart-area{
        height:93px;
    }

    .y-axis{
        width:19px;
        height:74px;
        margin-top:1px;
    }

    .y-label{
        font-size:4px;
        right:3px;
    }

    .plot{
        height:74px;
        margin-top:1px;
        background:
            repeating-linear-gradient(
                to top,
                transparent 0,
                transparent 13px,
                #e4e8eb 13px,
                #e4e8eb 14px
            ) !important;
    }

    .bar-value{
        font-size:5px;
        margin-bottom:1px;
        color:#111 !important;
    }

    .bar{
        width:50%;
        min-height:2px;
    }

    /*
       الرسم البياني الملون في الطباعة
    */

    .bar.green{
        background:#35b765 !important;
        background-color:#35b765 !important;
        border:1px solid #278d4b !important;
    }

    .bar.blue{
        background:#3488d8 !important;
        background-color:#3488d8 !important;
        border:1px solid #2469a9 !important;
    }

    .bar.yellow{
        background:#ffd44d !important;
        background-color:#ffd44d !important;
        border:1px solid #d5a900 !important;
    }

    .bar.red{
        background:#ef404a !important;
        background-color:#ef404a !important;
        border:1px solid #c52d36 !important;
    }

    .bar-name{
        top:77px;
        font-size:4.5px;
    }

    /* TABLE */

    .details-box{
        border-radius:0;
    }

    .details-title{
        padding:2px;
        font-size:5.8px;
        background:#073b68 !important;
        color:#fff !important;
    }

    .table-wrap{
        overflow:visible;
    }

    table{
        min-width:0;
        table-layout:fixed;
    }

    th,
    td{
        padding:1.5px 1.5px;
        font-size:5px;
        border:1px solid #7e7e7e;
        line-height:1.05;
    }

    th{
        font-size:5px;
        background:#dbe8f2 !important;
        color:#073b68 !important;
    }

    th:nth-child(1),
    td:nth-child(1){
        width:5%;
    }

    th:nth-child(2),
    td:nth-child(2){
        width:16%;
    }

    th:nth-child(3),
    td:nth-child(3){
        width:38%;
    }

    th:nth-child(4),
    td:nth-child(4){
        width:13%;
    }

    th:nth-child(5),
    td:nth-child(5){
        width:15%;
    }

    th:nth-child(6),
    td:nth-child(6){
        width:13%;
    }

    /*
       ألوان أسماء وصفوف الطلاب
    */

    .row-high td{
        background:#d8f3df !important;
        background-color:#d8f3df !important;
    }

    .row-high .student-name{
        color:#126b34 !important;
        font-weight:900 !important;
    }

    .row-medium td{
        background:#dceeff !important;
        background-color:#dceeff !important;
    }

    .row-medium .student-name{
        color:#125c9d !important;
        font-weight:900 !important;
    }

    .row-care td{
        background:#fff1aa !important;
        background-color:#fff1aa !important;
    }

    .row-care .student-name{
        color:#735800 !important;
        font-weight:900 !important;
    }

    .row-case td{
        background:#ffd1d4 !important;
        background-color:#ffd1d4 !important;
    }

    .row-case .student-name{
        color:#aa1f28 !important;
        font-weight:900 !important;
    }

    .row-absent td,
    .row-unrecorded td{
        background:#e7eaed !important;
        background-color:#e7eaed !important;
    }

<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig={

    apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",

    authDomain:"results2026-7c0dd.firebaseapp.com",

    projectId:"results2026-7c0dd",

    storageBucket:"results2026-7c0dd.firebasestorage.app",

    messagingSenderId:"241421115694",

    appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"

};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();


/* =====================================================
   CONSTANTS
===================================================== */

const gradeOrder=[

    "1 ابتدائي",
    "2 ابتدائي",
    "3 ابتدائي",
    "4 ابتدائي",
    "5 ابتدائي",
    "6 ابتدائي",

    "1 متوسط",
    "2 متوسط",
    "3 متوسط",

    "1 ثانوي",
    "2 ثانوي",
    "3 ثانوي"

];

const sectionOrder=[
    "أ","ب","ج","د"
];


/* =====================================================
   VARIABLES
===================================================== */

let role="";
let isAdmin=false;
let isTeacher=false;

let currentUsername="";
let currentTeacher=null;

let assignments=[];
let subjects=[];
let tests=[];

let selectedSubjectId="";
let selectedSubjectName="";
let selectedGrade="";
let selectedSection="";
let selectedTest=null;

let students=[];
let gradeRecords=[];
let analyzedStudents=[];


/* =====================================================
   URL
===================================================== */

const urlParams=
new URLSearchParams(
    window.location.search
);

const incoming={

    subjectId:
        urlParams.get("subjectId")||"",

    grade:
        urlParams.get("grade")||"",

    section:
        urlParams.get("section")||"",

    testId:
        urlParams.get("testId")||""

};


/* =====================================================
   HELPERS
===================================================== */

function el(id){
    return document.getElementById(id);
}


function escapeHtml(value){

    return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function unique(values){
    return [...new Set(values)];
}


function clearSelect(select,text){

    select.innerHTML="";

    const option=
        document.createElement("option");

    option.value="";
    option.textContent=text;

    select.appendChild(option);

}


function formatNumber(value){

    if(
        value===null ||
        value===undefined ||
        Number.isNaN(Number(value))
    ){
        return "-";
    }

    const n=Number(value);

    return Number.isInteger(n)
        ? String(n)
        : n.toFixed(2);
}


function sortGrades(list){

    return list.sort(
        (a,b)=>
        gradeOrder.indexOf(a)-
        gradeOrder.indexOf(b)
    );
}


function sortSections(list){

    return list.sort(
        (a,b)=>
        sectionOrder.indexOf(a)-
        sectionOrder.indexOf(b)
    );
}


/* =====================================================
   SECURITY
===================================================== */

function protectPage(){

    role=
        localStorage.getItem(
            "currentUserRole"
        )||"";


    isAdmin=
        role==="admin" ||
        role==="superadmin";


    isTeacher=
        role==="teacher";


    if(
        !isAdmin &&
        !isTeacher
    ){

        alert(
            "يجب تسجيل الدخول أولًا."
        );

        location.href=
            "index.html";

        return false;
    }

    return true;
}


/* =====================================================
   TEACHER
===================================================== */

async function loadTeacher(){

    if(!isTeacher){
        return;
    }


    currentUsername=(

        localStorage.getItem("currentUserEmail") ||

        localStorage.getItem("currentUser") ||

        ""

    ).trim().toLowerCase();


    if(!currentUsername){

        throw new Error(
            "لم يتم العثور على حساب المعلم."
        );
    }


    const doc=
        await db
        .collection("teachers")
        .doc(currentUsername)
        .get();


    if(!doc.exists){

        throw new Error(
            "لم يتم العثور على بيانات المعلم."
        );
    }


    currentTeacher={
        email:doc.id,
        ...doc.data()
    };


    assignments=
        Array.isArray(
            currentTeacher.assignments
        )
        ?
        currentTeacher.assignments.filter(
            a=>
            a.subjectId &&
            a.grade &&
            a.section
        )
        :
        [];
}


/* =====================================================
   SUBJECTS
===================================================== */

async function loadSubjects(){

    const snap=
        await db
        .collection("subjects")
        .get();


    subjects=[];


    snap.forEach(doc=>{

        subjects.push({
            id:doc.id,
            ...doc.data()
        });

    });


    subjects.sort(
        (a,b)=>
        String(a.name||"")
        .localeCompare(
            String(b.name||""),
            "ar"
        )
    );


    renderSubjects();
}


function renderSubjects(){

    const select=
        el("subjectSelect");


    clearSelect(
        select,
        "اختر المادة"
    );


    let list=[];


    if(isAdmin){

        list=subjects;

    }

    else{

        const ids=
            new Set(
                assignments.map(
                    a=>a.subjectId
                )
            );


        list=
            subjects.filter(
                s=>ids.has(s.id)
            );
    }


    list.forEach(subject=>{

        const option=
            document.createElement(
                "option"
            );

        option.value=
            subject.id;

        option.textContent=
            subject.name;

        select.appendChild(option);

    });
}


/* =====================================================
   SUBJECT CHANGE
===================================================== */

async function subjectChanged(){

    selectedSubjectId=
        el("subjectSelect").value;


    const subject=
        subjects.find(
            s=>s.id===selectedSubjectId
        );


    selectedSubjectName=
        subject?.name||"";


    selectedGrade="";
    selectedSection="";
    selectedTest=null;


    await fillGrades();


    clearSelect(
        el("sectionSelect"),
        "اختر الشعبة"
    );


    clearSelect(
        el("testSelect"),
        "اختر الاختبار"
    );


    clearAnalysis();
}


/* =====================================================
   GRADES
===================================================== */

async function fillGrades(){

    const select=
        el("gradeSelect");


    clearSelect(
        select,
        "اختر الصف"
    );


    if(!selectedSubjectId){
        return;
    }


    let list=[];


    if(isTeacher){

        list=
            unique(

                assignments
                .filter(
                    a=>
                    a.subjectId===
                    selectedSubjectId
                )
                .map(a=>a.grade)

            );

    }

    else{

        const snap=
            await db
            .collection("tests")
            .where(
                "subjectId",
                "==",
                selectedSubjectId
            )
            .get();


        const set=
            new Set();


        snap.forEach(doc=>{

            const data=
                doc.data()||{};


            const classes=
                Array.isArray(data.classes)
                ?
                data.classes
                :
                [];


            classes.forEach(c=>{

                if(c.grade){
                    set.add(c.grade);
                }

            });

        });


        list=[...set];
    }


    sortGrades(list);


    list.forEach(grade=>{

        const option=
            document.createElement(
                "option"
            );

        option.value=grade;
        option.textContent=grade;

        select.appendChild(option);

    });
}


async function gradeChanged(){

    selectedGrade=
        el("gradeSelect").value;


    selectedSection="";
    selectedTest=null;


    await fillSections();


    clearSelect(
        el("testSelect"),
        "اختر الاختبار"
    );


    clearAnalysis();
}


/* =====================================================
   SECTIONS
===================================================== */

async function fillSections(){

    const select=
        el("sectionSelect");


    clearSelect(
        select,
        "اختر الشعبة"
    );


    if(
        !selectedSubjectId ||
        !selectedGrade
    ){
        return;
    }


    let list=[];


    if(isTeacher){

        list=
            unique(

                assignments
                .filter(a=>

                    a.subjectId===
                    selectedSubjectId &&

                    a.grade===
                    selectedGrade

                )
                .map(a=>a.section)

            );

    }

    else{

        const snap=
            await db
            .collection("tests")
            .where(
                "subjectId",
                "==",
                selectedSubjectId
            )
            .get();


        const set=
            new Set();


        snap.forEach(doc=>{

            const data=
                doc.data()||{};


            const classes=
                Array.isArray(data.classes)
                ?
                data.classes
                :
                [];


            classes.forEach(c=>{

                if(
                    c.grade===
                    selectedGrade &&
                    c.section
                ){

                    set.add(c.section);

                }

            });

        });


        list=[...set];
    }


    sortSections(list);


    list.forEach(section=>{

        const option=
            document.createElement(
                "option"
            );

        option.value=section;
        option.textContent=section;

        select.appendChild(option);

    });
}


async function sectionChanged(){

    selectedSection=
        el("sectionSelect").value;

    selectedTest=null;

    clearAnalysis();


    if(
        selectedSubjectId &&
        selectedGrade &&
        selectedSection
    ){

        await loadTests();

    }

    else{

        clearSelect(
            el("testSelect"),
            "اختر الاختبار"
        );

    }
}


/* =====================================================
   TESTS
===================================================== */

async function loadTests(){

    const select=
        el("testSelect");


    clearSelect(
        select,
        "اختر الاختبار"
    );


    const snap=
        await db
        .collection("tests")
        .where(
            "subjectId",
            "==",
            selectedSubjectId
        )
        .get();


    tests=[];


    snap.forEach(doc=>{

        const data=
            doc.data()||{};


        const classes=
            Array.isArray(data.classes)
            ?
            data.classes
            :
            [];


        const matches=
            classes.some(c=>

                c.grade===selectedGrade &&
                c.section===selectedSection

            );


        if(matches){

            tests.push({
                id:doc.id,
                ...data
            });

        }

    });


    tests.sort(
        (a,b)=>
        String(a.date||"")
        .localeCompare(
            String(b.date||"")
        )
    );


    if(!tests.length){

        clearSelect(
            select,
            "لا توجد اختبارات"
        );

        return;
    }


    tests.forEach(test=>{

        const option=
            document.createElement(
                "option"
            );

        option.value=
            test.id;


        option.textContent=
            test.name+
            (
                test.date
                ?
                " - "+test.date
                :
                ""
            );


        select.appendChild(option);

    });
}


async function testChanged(){

    const id=
        el("testSelect").value;


    selectedTest=
        tests.find(
            t=>t.id===id
        )||null;


    if(!selectedTest){

        clearAnalysis();

        return;
    }


    showSelectedInfo();

    await loadResults();
}


/* =====================================================
   LOAD RESULTS
===================================================== */

async function loadResults(){

    el("analysisArea").innerHTML=`

        <div class="empty">
            جاري تحليل النتائج...
        </div>

    `;


    const studentSnap=
        await db
        .collection("students")
        .where(
            "grade",
            "==",
            selectedGrade
        )
        .get();


    students=[];


    studentSnap.forEach(doc=>{

        const data=
            doc.data()||{};


        if(
            data.section===
            selectedSection
        ){

            students.push({

                ...data,

                code:
                    data.code||
                    doc.id

            });

        }

    });


    students.sort(
        (a,b)=>
        String(a.name||"")
        .localeCompare(
            String(b.name||""),
            "ar"
        )
    );


    const gradeSnap=
        await db
        .collection("grades")
        .where(
            "testId",
            "==",
            selectedTest.id
        )
        .get();


    gradeRecords=[];


    gradeSnap.forEach(doc=>{

        const data=
            doc.data()||{};


        if(
            data.grade===selectedGrade &&
            data.section===selectedSection
        ){

            gradeRecords.push({
                id:doc.id,
                ...data
            });

        }

    });


    reanalyze();
}


/* =====================================================
   LEVEL SETTINGS
===================================================== */

function getLevelSettings(){

    let high=
        Number(
            el("highMin").value
        );


    let medium=
        Number(
            el("mediumMin").value
        );


    let care=
        Number(
            el("careMin").value
        );


    if(Number.isNaN(high)){
        high=85;
    }

    if(Number.isNaN(medium)){
        medium=70;
    }

    if(Number.isNaN(care)){
        care=50;
    }


    high=
        Math.max(
            0,
            Math.min(100,high)
        );


    medium=
        Math.max(
            0,
            Math.min(100,medium)
        );


    care=
        Math.max(
            0,
            Math.min(100,care)
        );


    if(medium>=high){

        medium=
            Math.max(
                0,
                high-1
            );

        el("mediumMin").value=
            medium;
    }


    if(care>=medium){

        care=
            Math.max(
                0,
                medium-1
            );

        el("careMin").value=
            care;
    }


    el("highMin").value=
        high;


    return{
        high,
        medium,
        care
    };
}


/* =====================================================
   ANALYZE
===================================================== */

function reanalyze(){

    if(!selectedTest){
        return;
    }


    const limits=
        getLevelSettings();


    analyzedStudents=
        students.map(student=>{

            const record=
                gradeRecords.find(
                    r=>
                    String(r.studentCode)===
                    String(student.code)
                );


            if(!record){

                return{

                    student,
                    attendance:"unrecorded",
                    mark:null,
                    percentage:null,
                    level:"unrecorded"

                };

            }


            if(
                record.attendance===
                "absent"
            ){

                return{

                    student,
                    record,
                    attendance:"absent",
                    mark:null,
                    percentage:null,
                    level:"absent"

                };

            }


            const mark=
                Number(record.mark);


            const fullMark=
                Number(
                    record.fullMark ||
                    selectedTest.fullMark
                );


            const percentage=
                fullMark>0
                ?
                (mark/fullMark)*100
                :
                0;


            let level="case";


            if(
                percentage>=
                limits.high
            ){

                level="high";

            }

            else if(
                percentage>=
                limits.medium
            ){

                level="medium";

            }

            else if(
                percentage>=
                limits.care
            ){

                level="care";

            }


            return{

                student,
                record,
                attendance:"present",
                mark,
                fullMark,
                percentage,
                level

            };

        });


    renderAnalysis();
}


/* =====================================================
   RENDER
===================================================== */

function renderAnalysis(){

    const total=
        analyzedStudents.length;


    const present=
        analyzedStudents.filter(
            x=>
            x.attendance==="present"
        );


    const absent=
        analyzedStudents.filter(
            x=>
            x.attendance==="absent"
        );


    const unrecorded=
        analyzedStudents.filter(
            x=>
            x.attendance==="unrecorded"
        );


    const high=
        present.filter(
            x=>x.level==="high"
        );


    const medium=
        present.filter(
            x=>x.level==="medium"
        );


    const care=
        present.filter(
            x=>x.level==="care"
        );


    const cases=
        present.filter(
            x=>x.level==="case"
        );


    const marks=
        present.map(
            x=>x.mark
        );


    const average=
        marks.length
        ?
        marks.reduce(
            (a,b)=>a+b,
            0
        )/marks.length
        :
        null;


    const highest=
        marks.length
        ?
        Math.max(...marks)
        :
        null;


    const lowest=
        marks.length
        ?
        Math.min(...marks)
        :
        null;


    const passed=
        present.filter(
            x=>x.percentage>=50
        ).length;


    const successRate=
        present.length
        ?
        (passed/present.length)*100
        :
        0;


    const limits=
        getLevelSettings();


    el("analysisArea").innerHTML=`

        <div class="report-header">

            <img
                src="logo.jpeg"
                class="report-logo">

            <h2>
                مدارس الفلاح الأهلية
            </h2>

            <h3>
                تحليل نتائج الاختبار
            </h3>


            <div class="meta">

                <div class="meta-item">

                    <div class="meta-title">
                        المادة
                    </div>

                    <div class="meta-value">
                        ${escapeHtml(selectedSubjectName)}
                    </div>

                </div>


                <div class="meta-item">

                    <div class="meta-title">
                        الصف / الشعبة
                    </div>

                    <div class="meta-value">

                        ${escapeHtml(
                            selectedGrade+
                            " / "+
                            selectedSection
                        )}

                    </div>

                </div>


                <div class="meta-item">

                    <div class="meta-title">
                        الاختبار
                    </div>

                    <div class="meta-value">
                        ${escapeHtml(selectedTest.name)}
                    </div>

                </div>


                <div class="meta-item">

                    <div class="meta-title">
                        تاريخ الاختبار
                    </div>

                    <div class="meta-value">
                        ${escapeHtml(
                            selectedTest.date||"-"
                        )}
                    </div>

                </div>

            </div>

        </div>


        <div class="kpi-grid">

            ${kpi(
                "إجمالي الطلاب",
                total,
                "total"
            )}

            ${kpi(
                "حاضر",
                present.length,
                "green"
            )}

            ${kpi(
                "غائب",
                absent.length,
                "red"
            )}

            ${kpi(
                "لم يتم الرصد",
                unrecorded.length,
                "purple"
            )}

            ${kpi(
                "المتوسط",
                formatNumber(average),
                "blue"
            )}

            ${kpi(
                "أعلى درجة",
                formatNumber(highest),
                "green"
            )}

            ${kpi(
                "أقل درجة",
                formatNumber(lowest),
                "red"
            )}

            ${kpi(
                "نسبة النجاح",
                successRate.toFixed(1)+"%",
                "gold"
            )}

        </div>


        <div class="level-section">

            <div class="small-heading">
                توزيع المستويات
            </div>


            <div class="level-strip">

                ${levelSegment(
                    high.length,
                    present.length,
                    "level-high"
                )}

                ${levelSegment(
                    medium.length,
                    present.length,
                    "level-medium"
                )}

                ${levelSegment(
                    care.length,
                    present.length,
                    "level-care"
                )}

                ${levelSegment(
                    cases.length,
                    present.length,
                    "level-case"
                )}

            </div>


            <div class="level-labels">

                <div class="level-label">

                    <strong>
                        مستوى مرتفع
                    </strong>

/* =====================================================
   LEVEL SEGMENT
===================================================== */

function levelSegment(
    count,
    total,
    className
){

    const percent=
        total
        ?
        (count/total)*100
        :
        0;


    return`

        <div class="level-segment ${className}">

            <span class="count">
                ${count}
            </span>

            <span class="percent">
                ${percent.toFixed(1)}%
            </span>

        </div>

    `;
}


/* =====================================================
   CHART
===================================================== */

function buildChart(
    high,
    medium,
    care,
    cases,
    totalPresent
){

    const values=[
        high,
        medium,
        care,
        cases
    ];


    const maxValue=
        Math.max(
            ...values,
            1
        );


    function height(value){

        if(value===0){
            return 2;
        }

        return Math.max(
            6,
            (value/maxValue)*82
        );
    }


    const axisMax=
        Math.max(
            maxValue,
            4
        );


    const axisValues=[

        axisMax,

        Math.round(
            axisMax*.75
        ),

        Math.round(
            axisMax*.5
        ),

        Math.round(
            axisMax*.25
        ),

        0

    ];


    return`

        <div class="chart-box">

            <div class="chart-header">

                <div class="chart-title">
                    📊 الرسم البياني لتوزيع المستويات
                </div>

                <div class="chart-caption">
                    عدد الطلاب
                </div>

            </div>


            <div class="chart-area">

                <div class="y-axis">

                    ${axisValues.map(
                        (value,index)=>{

                            const bottom=
                                (
                                    index/
                                    (
                                        axisValues.length-1
                                    )
                                )*100;


                            return`

                                <span
                                    class="y-label"
                                    style="bottom:${bottom}%">

                                    ${value}

                                </span>

                            `;

                        }
                    ).join("")}

                </div>


                <div class="plot">

                    ${chartBar(
                        high,
                        totalPresent,
                        height(high),
                        "green",
                        "مستوى مرتفع"
                    )}

                    ${chartBar(
                        medium,
                        totalPresent,
                        height(medium),
                        "blue",
                        "مستوى متوسط"
                    )}

                    ${chartBar(
                        care,
                        totalPresent,
                        height(care),
                        "yellow",
                        "أولى بالرعاية"
                    )}

                    ${chartBar(
                        cases,
                        totalPresent,
                        height(cases),
                        "red",
                        "دراسة حالة"
                    )}

                </div>

            </div>

        </div>

    `;
}


function chartBar(
    value,
    total,
    heightPercent,
    color,
    name
){

    const percent=
        total
        ?
        (value/total)*100
        :
        0;


    return`

        <div class="bar-group">

            <div class="bar-value">

                ${value}

                <span style="font-size:.75em">

                    (${percent.toFixed(1)}%)

                </span>

            </div>


            <div
                class="bar ${color}"
                style="height:${heightPercent}% !important;">
            </div>


            <div class="bar-name">
                ${name}
            </div>

        </div>

    `;
}


/* =====================================================
   TABLE
===================================================== */

function buildTable(){

    if(!analyzedStudents.length){

        return`

            <div class="empty">
                لا يوجد طلاب في هذا الفصل.
            </div>

        `;
    }


    let rows="";


    analyzedStudents.forEach(
        (item,index)=>{

            let rowClass="";
            let attendance="";
            let mark="-";
            let percentage="-";
            let percentClass="";


            if(
                item.attendance===
                "absent"
            ){

                rowClass=
                    "row-absent";

                attendance=
                    "غائب";

            }

            else if(
                item.attendance===
                "unrecorded"
            ){

                rowClass=
                    "row-unrecorded";

                attendance=
                    "لم يتم الرصد";

            }

            else{

                attendance=
                    "حاضر";


                mark=
                    formatNumber(item.mark)+
                    " / "+
                    formatNumber(item.fullMark);


                percentage=
                    item.percentage.toFixed(1)+"%";


                if(
                    item.level==="high"
                ){

                    rowClass=
                        "row-high";

                    percentClass=
                        "percent-high";

                }

                else if(
                    item.level==="medium"
                ){

                    rowClass=
                        "row-medium";

                    percentClass=
                        "percent-medium";

                }

                else if(
                    item.level==="care"
                ){

                    rowClass=
                        "row-care";

                    percentClass=
                        "percent-care";

                }

                else{

                    rowClass=
                        "row-case";

                    percentClass=
                        "percent-case";

                }

            }


            rows+=`

                <tr class="${rowClass}">

                    <td>
                        ${index+1}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.student.code
                        )}
                    </td>

                    <td class="student-name">

                        ${escapeHtml(
                            item.student.name
                        )}

                    </td>

                    <td>
                        ${attendance}
                    </td>

                    <td>
                        ${mark}
                    </td>

                    <td class="${percentClass}">
                        ${percentage}
                    </td>

                </tr>

            `;

        }
    );


    return`

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>
                            كود الطالب
                        </th>

                        <th>
                            اسم الطالب
                        </th>

                        <th>
                            الحضور
                        </th>

                        <th>
                            الدرجة
                        </th>

                        <th>
                            النسبة
                        </th>

                    </tr>

                </thead>


                <tbody>
                    ${rows}
                </tbody>

            </table>

        </div>

    `;
}

/* =====================================================
   INCOMING SELECTION
===================================================== */

async function applyIncoming(){

    if(!incoming.subjectId){
        return;
    }


    /*
       تأمين فتح التحليل من رابط المعلم:
       لا نثق في قيم الرابط إلا لو الفصل
       مسند فعلًا للمعلم.
    */

    if(isTeacher){

        const allowed=
            assignments.some(a=>

                a.subjectId===
                incoming.subjectId &&

                a.grade===
                incoming.grade &&

                a.section===
                incoming.section

            );


        if(!allowed){
            return;
        }
    }


    const subjectSelect=
        el("subjectSelect");


    const subjectExists=
        [...subjectSelect.options]
        .some(
            o=>
            o.value===
            incoming.subjectId
        );


    if(!subjectExists){
        return;
    }


    subjectSelect.value=
        incoming.subjectId;


    selectedSubjectId=
        incoming.subjectId;


    const subject=
        subjects.find(
            s=>s.id===
            selectedSubjectId
        );


    selectedSubjectName=
        subject?.name||"";


    await fillGrades();


    if(incoming.grade){

        const gradeSelect=
            el("gradeSelect");


        const exists=
            [...gradeSelect.options]
            .some(
                o=>
                o.value===
                incoming.grade
            );


        if(exists){

            gradeSelect.value=
                incoming.grade;

            selectedGrade=
                incoming.grade;

            await fillSections();

        }
    }


    if(
        incoming.section &&
        selectedGrade
    ){

        const sectionSelect=
            el("sectionSelect");


        const exists=
            [...sectionSelect.options]
            .some(
                o=>
                o.value===
                incoming.section
            );


        if(exists){

            sectionSelect.value=
                incoming.section;

            selectedSection=
                incoming.section;

            await loadTests();

        }
    }


    if(
        incoming.testId &&
        selectedSection
    ){

        const exists=
            tests.some(
                t=>
                t.id===
                incoming.testId
            );


        if(exists){

            el("testSelect").value=
                incoming.testId;


            selectedTest=
                tests.find(
                    t=>
                    t.id===
                    incoming.testId
                );


            showSelectedInfo();

            await loadResults();

        }
    }
}
