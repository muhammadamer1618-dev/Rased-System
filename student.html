<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بوابة ولي الأمر - نظام راصد</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>

*{
    box-sizing:border-box;
}

:root{
    --navy:#0b4b78;
    --navy-dark:#073653;
    --blue:#0e6fa9;
    --gold:#d7aa2d;
    --gold-light:#f8e9ae;
    --bg:#f2f6f9;
    --text:#17344b;
    --muted:#748596;
    --border:#dbe4eb;
    --green:#2fa866;
    --red:#dc4b55;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 15% 10%,rgba(215,170,45,.10),transparent 25%),
        radial-gradient(circle at 90% 90%,rgba(14,111,169,.10),transparent 28%),
        linear-gradient(135deg,#f8fafc,#edf3f7);
}

/* =========================
   PAGE
========================= */

.page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.top-line{
    height:6px;
    background:linear-gradient(
        90deg,
        var(--navy-dark),
        var(--navy),
        var(--gold),
        var(--navy)
    );
}

.main{
    flex:1;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}

/* =========================
   MAIN CARD
========================= */

.portal{
    width:min(620px,100%);
    background:rgba(255,255,255,.97);
    border:1px solid rgba(11,75,120,.12);
    border-radius:24px;
    box-shadow:
        0 22px 60px rgba(18,52,75,.12),
        0 4px 15px rgba(18,52,75,.06);
    overflow:hidden;
    position:relative;
}

.portal::before{
    content:"";
    position:absolute;
    top:0;
    right:0;
    left:0;
    height:5px;
    background:linear-gradient(
        90deg,
        var(--gold),
        var(--navy),
        var(--gold)
    );
}

.portal-body{
    padding:30px 38px 34px;
}

/* =========================
   BRAND
========================= */

.brand{
    text-align:center;
    margin-bottom:26px;
}

.logo-wrap{
    width:88px;
    height:88px;
    margin:0 auto 12px;
    background:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
        0 6px 20px rgba(8,67,106,.12);
    border:1px solid #e5ebef;
}

.logo{
    width:78px;
    height:78px;
    object-fit:contain;
    border-radius:50%;
}

.school-name{
    font-size:14px;
    font-weight:bold;
    color:var(--navy);
    margin-bottom:5px;
}

.portal-title{
    margin:0;
    font-size:27px;
    color:var(--navy-dark);
    font-weight:900;
}

.gold-line{
    width:50px;
    height:4px;
    border-radius:10px;
    background:var(--gold);
    margin:11px auto;
}

.portal-description{
    margin:0;
    color:var(--muted);
    font-size:13px;
    line-height:1.8;
}

/* =========================
   SEARCH
========================= */

.search-area{
    max-width:480px;
    margin:auto;
}

.field-label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:var(--navy-dark);
    margin:0 3px 7px;
}

.identity-box{
    position:relative;
}

.identity-icon{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    width:34px;
    height:34px;
    border-radius:10px;
    background:#e9f2f8;
    color:var(--navy);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    pointer-events:none;
}

#identityInput{
    width:100%;
    height:57px;
    border:1.5px solid #cad8e2;
    border-radius:14px;
    background:#fbfcfd;
    color:#172d3f;
    padding:0 59px 0 15px;
    font-family:Tahoma,Arial,sans-serif;
    font-size:17px;
    font-weight:bold;
    outline:none;
    transition:.2s;
    direction:ltr;
    text-align:center;
    letter-spacing:1px;
}

#identityInput::placeholder{
    color:#a0aab3;
    font-weight:normal;
    letter-spacing:0;
}

#identityInput:focus{
    background:#fff;
    border-color:var(--blue);
    box-shadow:0 0 0 4px rgba(14,111,169,.09);
}

.search-btn{
    width:100%;
    height:53px;
    margin-top:12px;
    border:0;
    border-radius:14px;
    color:#fff;
    background:linear-gradient(
        135deg,
        var(--navy-dark),
        var(--navy),
        #116a9e
    );
    font-family:Tahoma,Arial,sans-serif;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(11,75,120,.18);
    transition:.2s;
}

.search-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 24px rgba(11,75,120,.23);
}

.search-btn:active{
    transform:scale(.99);
}

.search-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
    transform:none;
}

.helper{
    text-align:center;
    font-size:10px;
    color:#8a99a6;
    margin-top:10px;
}

.message{
    display:none;
    margin-top:14px;
    border-radius:12px;
    padding:11px 13px;
    text-align:center;
    font-size:12px;
    font-weight:bold;
}

.message.error{
    display:block;
    background:#fff0f1;
    color:#ad2631;
    border:1px solid #f1c4c8;
}

.message.success{
    display:block;
    background:#edf9f2;
    color:#247647;
    border:1px solid #bde5ce;
}

/* =========================
   RESULTS
========================= */

#resultsArea{
    display:none;
    width:min(1050px,100%);
}

.results-container{
    background:#fff;
    border:1px solid #dce5eb;
    border-radius:20px;
    box-shadow:0 18px 50px rgba(18,52,75,.10);
    overflow:hidden;
}

.results-head{
    padding:18px 22px;
    background:linear-gradient(
        135deg,
        var(--navy-dark),
        var(--navy)
    );
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.results-brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.result-logo{
    width:54px;
    height:54px;
    object-fit:contain;
    background:#fff;
    border-radius:50%;
    padding:2px;
}

.results-head h2{
    margin:0 0 3px;
    font-size:20px;
}

.results-head p{
    margin:0;
    font-size:10px;
    color:#d8e7f1;
}

.results-actions{
    display:flex;
    gap:7px;
}

.action-btn{
    border:0;
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-family:Tahoma,Arial,sans-serif;
    font-weight:bold;
}

.new-search{
    background:#fff;
    color:var(--navy);
}

.print-btn{
    background:var(--gold);
    color:#fff;
}

/* =========================
   STUDENT DATA
========================= */

.student-info{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    border-bottom:1px solid #dce5eb;
}

.info-item{
    padding:13px 15px;
    border-left:1px solid #dce5eb;
}

.info-item:last-child{
    border-left:0;
}

.info-label{
    display:block;
    color:#80909d;
    font-size:9px;
    margin-bottom:4px;
}

.info-value{
    font-size:13px;
    font-weight:bold;
    color:var(--navy-dark);
}

/* =========================
   SUMMARY
========================= */

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    padding:13px 18px 5px;
}

.summary-card{
    text-align:center;
    border-radius:10px;
    padding:9px 5px;
    border:1px solid #dde5eb;
}

.summary-card:nth-child(1){
    background:#eaf4fa;
}

.summary-card:nth-child(2){
    background:#edf8f1;
}

.summary-card:nth-child(3){
    background:#fff5d6;
}

.summary-card:nth-child(4){
    background:#fff0f1;
}

.summary-label{
    font-size:9px;
    font-weight:bold;
    color:#627382;
}

.summary-value{
    font-size:19px;
    font-weight:900;
    color:var(--navy);
    margin-top:2px;
}

/* =========================
   RESULTS TABLE
========================= */

.results-content{
    padding:13px 18px 20px;
}

.section-title{
    color:var(--navy-dark);
    font-size:14px;
    font-weight:bold;
    margin:0 0 9px;
    padding-bottom:7px;
    border-bottom:2px solid var(--gold);
}

.table-wrap{
    overflow-x:auto;
    border:1px solid #d5dfe6;
    border-radius:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th{
    background:#eaf1f6;
    color:var(--navy-dark);
    font-size:11px;
    padding:9px 6px;
    border-bottom:1px solid #cad6df;
}

td{
    padding:9px 6px;
    font-size:11px;
    text-align:center;
    border-bottom:1px solid #e2e8ed;
}

tbody tr:last-child td{
    border-bottom:0;
}

tbody tr:hover{
    background:#f7fafc;
}

.subject-name{
    font-weight:bold;
    color:var(--navy);
}

.present{
    color:#218654;
    font-weight:bold;
}

.absent{
    color:#c93e48;
    font-weight:bold;
}

.grade-good{
    color:#18814b;
    font-weight:bold;
}

.grade-low{
    color:#c43b45;
    font-weight:bold;
}

.no-results{
    text-align:center;
    padding:35px 15px;
    color:#7d8d9a;
}

/* =========================
   RESULTS FOOTER
========================= */

.results-footer{
    display:flex;
    justify-content:space-between;
    padding:9px 18px;
    border-top:1px solid #dce5eb;
    color:#788997;
    font-size:9px;
}

/* =========================
   PAGE FOOTER
========================= */

.page-footer{
    text-align:center;
    padding:0 15px 18px;
    color:#8796a3;
    font-size:10px;
}

.page-footer strong{
    color:var(--navy);
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .main{
        align-items:flex-start;
        padding-top:22px;
    }

    .portal{
        border-radius:19px;
    }

    .portal-body{
        padding:25px 20px 28px;
    }

    .logo-wrap{
        width:78px;
        height:78px;
    }

    .logo{
        width:68px;
        height:68px;
    }

    .portal-title{
        font-size:23px;
    }

    .student-info{
        grid-template-columns:1fr 1fr;
    }

    .info-item:first-child{
        grid-column:1/-1;
    }

    .summary{
        grid-template-columns:repeat(2,1fr);
    }

    .results-head{
        flex-direction:column;
        text-align:center;
    }

    .results-brand{
        flex-direction:column;
    }
}

/* =========================
   PRINT
========================= */

@media print{

    @page{
        size:A4 portrait;
        margin:8mm;
    }

    *{
        -webkit-print-color-adjust:exact !important;
        print-color-adjust:exact !important;
    }

    body{
        background:#fff !important;
    }

    .top-line,
    #searchPortal,
    .page-footer,
    .results-actions{
        display:none !important;
    }

    .main{

    }

    #resultsArea{
        display:block !important;

    }

    .results-container{
        box-shadow:none;

    }

    .results-head{
        padding:9px 12px;
        background:#0b4b78 !important;
    }

    .result-logo{

        height:45px;
    }

    .results-head h2{

    }

    .student-info{

    }

    .summary{

    }

    }

    }

    }

    table{

        padding:5px 3px;

    }

    .results-footer{
        padding:6px 10px;
        font-size:7px;

}

</style>
</head>

<body>

<div class="page">

    <div class="top-line"></div>

    <main class="main">

        <!-- =========================
             SEARCH PORTAL
        ========================== -->

        <section id="searchPortal" class="portal">

            <div class="portal-body">

                <div class="brand">

                    <div class="logo-wrap">
                        <img
                            src="logo.jpeg"
                            alt="مدارس الفلاح الأهلية"
                            class="logo">
                    </div>

                    <div class="school-name">
                        مدارس الفلاح الأهلية
                    </div>

                    <h1 class="portal-title">
                        بوابة ولي الأمر
                    </h1>

                    <div class="gold-line"></div>

                    <p class="portal-description">
                        استعلم عن نتائج الطالب في جميع المواد
                    </p>

                </div>


                <div class="search-area">

                    <label class="field-label" for="identityInput">
                        رقم الهوية
                    </label>

                    <div class="identity-box">

                        <div class="identity-icon">
                            ♙
                        </div>

                        <input
                            type="text"
                            inputmode="numeric"
                            autocomplete="off"
                            id="identityInput"
                            placeholder="أدخل رقم الهوية"
                            maxlength="20">

                    </div>


                    <button
                        id="searchBtn"
                        class="search-btn"
                        onclick="searchStudent()">

                        عرض النتائج

                    </button>


                    <div class="helper">
                        أدخل رقم الهوية المسجل لدى المدرسة
                    </div>


                    <div id="message" class="message"></div>

                </div>

            </div>

        </section>


        <!-- =========================
             RESULTS
        ========================== -->

        <section id="resultsArea"></section>

    </main>


    <footer class="page-footer">
        <strong>نظام راصد</strong>
        • مدارس الفلاح الأهلية
        • تصميم محمد عامر أحمد 2026
    </footer>

</div>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig={
    apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",
    authDomain:"results2026-7c0dd.firebaseapp.com",
    projectId:"results2026-7c0dd",
    storageBucket:"results2026-7c0dd.firebasestorage.app",
    messagingSenderId:"241421115694",
    appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();


/* =========================
   VARIABLES
========================= */

let currentStudent=null;
let currentResults=[];


/* =========================
   HELPERS
========================= */

function el(id){
    return document.getElementById(id);
}


function escapeHtml(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function cleanIdentity(value){

    return String(value||"")
        .replace(/[^\d]/g,"")
        .trim();
}


function formatMark(value){

    if(
        value===null ||
        value===undefined ||
        value===""
    ){
        return "—";
    }

    const n=Number(value);

    if(Number.isNaN(n)){
        return "—";
    }

    return Number.isInteger(n)
        ? String(n)
        : n.toFixed(2);
}


function showMessage(text,type="error"){

    const box=el("message");

    box.className=
        "message "+type;

    box.textContent=text;
}


function hideMessage(){

    const box=el("message");

    box.className="message";
    box.textContent="";
}


/* =========================
   SEARCH
========================= */

async function searchStudent(){

    hideMessage();

    const identity=
        cleanIdentity(
            el("identityInput").value
        );


    if(!identity){

        showMessage(
            "فضلاً أدخل رقم الهوية."
        );

        el("identityInput").focus();

        return;
    }


    const btn=el("searchBtn");

    btn.disabled=true;
    btn.textContent="جاري البحث...";


    try{

        /*
          رقم الهوية هو نفسه document ID
          المستخدم حاليًا في students/{code}
        */

        let studentDoc=
            await db
                .collection("students")
                .doc(identity)
                .get();


        /*
          احتياط في حالة كان رقم الهوية
          مخزن داخل حقل code وليس Document ID
        */

        if(!studentDoc.exists){

            const studentQuery=
                await db
                    .collection("students")
                    .where("code","==",identity)
                    .limit(1)
                    .get();


            if(!studentQuery.empty){

                studentDoc=
                    studentQuery.docs[0];
            }
        }


        if(!studentDoc.exists){

            showMessage(
                "لم يتم العثور على طالب بهذا الرقم."
            );

            return;
        }


        const data=
            studentDoc.data()||{};


        currentStudent={
            ...data,
            code:
                data.code ||
                studentDoc.id
        };


        await loadStudentResults(
            currentStudent.code
        );


        renderResults();

    }

    catch(error){

        console.error(error);

        showMessage(
            "تعذر تحميل النتائج حاليًا. حاول مرة أخرى."
        );

    }

    finally{

        btn.disabled=false;
        btn.textContent="عرض النتائج";
    }
}


/* =========================
   LOAD RESULTS
========================= */

async function loadStudentResults(studentCode){

    currentResults=[];


    const snap=
        await db
            .collection("grades")
            .where(
                "studentCode",
                "==",
                String(studentCode)
            )
            .get();


    snap.forEach(doc=>{

        currentResults.push({
            id:doc.id,
            ...doc.data()
        });

    });


    /*
      الأحدث أولاً
    */

    currentResults.sort((a,b)=>{

        const dateA=
            String(
                a.testDate||""
            );

        const dateB=
            String(
                b.testDate||""
            );

        return dateB.localeCompare(dateA);

    });
}


/* =========================
   RENDER
========================= */

function renderResults(){

    el("searchPortal").style.display="none";

    const resultsArea=
        el("resultsArea");

    resultsArea.style.display="block";


    const recorded=
        currentResults.filter(
            r=>
            r.attendance==="present" &&
            r.mark!==null &&
            r.mark!==undefined
        );


    const absent=
        currentResults.filter(
            r=>r.attendance==="absent"
        );


    let percentages=[];


    recorded.forEach(r=>{

        const mark=
            Number(r.mark);

        const fullMark=
            Number(r.fullMark);


        if(
            !Number.isNaN(mark) &&
            !Number.isNaN(fullMark) &&
            fullMark>0
        ){

            percentages.push(
                (mark/fullMark)*100
            );
        }

    });


    const average=
        percentages.length
        ?
        percentages.reduce(
            (a,b)=>a+b,
            0
        )/percentages.length
        :
        null;


    const passed=
        percentages.filter(
            p=>p>=50
        ).length;


    const successRate=
        percentages.length
        ?
        (passed/percentages.length)*100
        :
        null;


    resultsArea.innerHTML=`

        <div class="results-container">

            <div class="results-head">

                <div class="results-brand">

                    <img
                        src="logo.jpeg"
                        class="result-logo">

                    <div>

                        <h2>
                            نتائج الطالب
                        </h2>

                        <p>
                            مدارس الفلاح الأهلية
                            • نظام راصد
                        </p>

                    </div>

                </div>


                <div class="results-actions">

                    <button
                        class="action-btn new-search"
                        onclick="newSearch()">

                        بحث جديد

                    </button>

                    <button
                        class="action-btn print-btn"
                        onclick="window.print()">

                        طباعة / PDF

                    </button>

                </div>

            </div>


            <div class="student-info">

                <div class="info-item">

                    <span class="info-label">
                        اسم الطالب
                    </span>

                    <span class="info-value">
                        ${escapeHtml(
                            currentStudent.name||"-"
                        )}
                    </span>

                </div>


                <div class="info-item">

                    <span class="info-label">
                        الصف
                    </span>

                    <span class="info-value">
                        ${escapeHtml(
                            currentStudent.grade||"-"
                        )}
                    </span>

                </div>


                <div class="info-item">

                    <span class="info-label">
                        الشعبة
                    </span>

                    <span class="info-value">
                        ${escapeHtml(
                            currentStudent.section||"-"
                        )}
                    </span>

                </div>

            </div>


            <div class="summary">

                ${summaryCard(
                    "عدد الاختبارات",
                    currentResults.length
                )}

                ${summaryCard(
                    "اختبارات تم رصدها",
                    recorded.length
                )}

                ${summaryCard(
                    "متوسط الأداء",
                    average===null
                    ?
                    "—"
                    :
                    average.toFixed(1)+"%"
                )}

                ${summaryCard(
                    "حالات الغياب",
                    absent.length
                )}

            </div>


            <div class="results-content">

                <div class="section-title">
                    تفاصيل النتائج
                </div>

                ${buildResultsTable()}

            </div>


            <div class="results-footer">

                <span>
                    جميع النتائج المسجلة للطالب
                </span>

                <span>
                    تصميم محمد عامر أحمد - 2026
                </span>

            </div>

        </div>

    `;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================
   SUMMARY
========================= */

function summaryCard(label,value){

    return`

        <div class="summary-card">

            <div class="summary-label">
                ${label}
            </div>

            <div class="summary-value">
                ${value}
            </div>

        </div>

    `;
}


/* =========================
   TABLE
========================= */

function buildResultsTable(){

    if(!currentResults.length){

        return`

            <div class="no-results">

                لا توجد نتائج اختبارات
                مسجلة للطالب حتى الآن.

            </div>

        `;
    }


    let rows="";


    currentResults.forEach(
        (result,index)=>{

            const isAbsent=
                result.attendance==="absent";


            const mark=
                isAbsent
                ?
                "—"
                :
                formatMark(
                    result.mark
                );


            const fullMark=
                formatMark(
                    result.fullMark
                );


            let percentage="—";
            let gradeClass="";


            if(
                !isAbsent &&
                result.mark!==null &&
                result.mark!==undefined &&
                Number(result.fullMark)>0
            ){

                const p=
                    (
                        Number(result.mark) /
                        Number(result.fullMark)
                    )*100;


                percentage=
                    p.toFixed(1)+"%";


                gradeClass=
                    p>=50
                    ?
                    "grade-good"
                    :
                    "grade-low";
            }


            rows+=`

                <tr>

                    <td>
                        ${index+1}
                    </td>

                    <td class="subject-name">

                        ${escapeHtml(
                            result.subjectName||"-"
                        )}

                    </td>

                    <td>

                        ${escapeHtml(
                            result.testName||"-"
                        )}

                    </td>

                    <td>

                        ${escapeHtml(
                            result.testDate||"-"
                        )}

                    </td>

                    <td class="${
                        isAbsent
                        ?
                        "absent"
                        :
                        "present"
                    }">

                        ${
                            isAbsent
                            ?
                            "غائب"
                            :
                            "حاضر"
                        }

                    </td>

                    <td class="${gradeClass}">

                        ${
                            isAbsent
                            ?
                            "—"
                            :
                            mark+" / "+fullMark
                        }

                    </td>

                    <td class="${gradeClass}">
                        ${percentage}
                    </td>

                </tr>

            `;
        }
    );


    return`

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>المادة</th>

                        <th>الاختبار</th>

                        <th>التاريخ</th>

                        <th>الحضور</th>

                        <th>الدرجة</th>

                        <th>النسبة</th>

                    </tr>

                </thead>

                <tbody>
                    ${rows}
                </tbody>

            </table>

        </div>

    `;
}

   NEW SEARCH
========================= */

function newSearch(){

    currentStudent=null;
    currentResults=[];


    el("resultsArea").style.display="none";

    el("resultsArea").innerHTML="";


    el("searchPortal").style.display="block";


    el("identityInput").value="";

    hideMessage();


    setTimeout(()=>{

        el("identityInput").focus();

    },100);
}

   ENTER
========================= */

el("identityInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter"){

            searchStudent();

    }
);


/* =========================

========================= */

el("identityInput")
.addEventListener(

        this.value=
            this.value.replace(

    }
